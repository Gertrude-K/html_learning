
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>My Feedback Form</h2>
    <ul>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="email">
        <br><br>
        <p>Please check all emotions that apply to you:</p>
        
        <label for="angry">Angry</label>
        <input type="checkbox" id="angry" name="angry"><br>
        <label for="sad">Saf</label>
        <input type="checkbox" id="sad" name="sad"><br>
        <label for="happy">Happy</label>
        <input type="checkbox" id="happy" name="happy"><br>
        <label for="ambivalent">Ambivalent</label>
        <input type="checkbox" id="ambivalent" name="ambivalent"><br>
        <p>How satisfied were you with our service?</p>
        <label for="very_">Very satisfied</label>
        <input type="radio" name="satisfaction" id="very_"><br>
        <label for="satisfied">Satisfied</label>
        <input type="radio" name="satisfaction" id="satisfied"><br>
        <label for="Did_not_care">Didn't care</label>
        <input type="radio" name="satisfaction" id="Did_not_care"><br>
        <label for="dissatisfied">Dissatisfied</label>
        <input type="radio" name="satisfaction" id="dissatisfied"><br>
        <label for="very_dissatisfied">Very dissatisfied</label>
        <input type="radio" name="satisfaction" id="very_dissatisfied"><br>
        <label for="Comments">Further comments:</label>
        <textarea name="comments" id="Comments" title="comments" placeholder="Enter your comment:"></textarea><br><br>
        <label for="photo">Bio Photo:</label>
        <input type="file" name="bio" id="photo"><br><br>
        <label for="location">Location visited:</label>
        <select name="location" id="location" required>
            <option value="" selected disabled>select location</option>
            <option value="nakuru">Nakuru</option>
            <option value="nairobi">Nairobi</option>
            <option value="kiambu">Kiambu</option>
            <option value="kericho">Kericho</option>
            <option value="mombasa">Mombasa</option>
        </select><br><br>
        <input type="button" value="submit">
    <ul>
</body>
</html>
