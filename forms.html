<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        <label for="name">First Name:</label>
        <input type="text" id="name" name="name" placeholder="eg.Gertrude"><br><br>
        <label for="l_name">Last Name:</label>
        <input type="text" id="l_name" name="last_name"><br><br>]
        <label for="age">Age: </label>
        <input type="number" id="age" name="age"><br><br>
        <label for="password">Password: </label>
        <input type="password" id="password" name="password"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="date">Choose date:</label>
        <input type="date" id="date" name="date"><br><br>
        <label for="file">CV:</label>
        <input type="file" id="file" name="file"><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
        <label for="website">Enter website </label>
        <input type="url" name="link" id ="website"><br><br>
        <label for="time">Start time</label>
        <input type="time" name="time" id="time"><br><br>
        <label for="search">Search: </label>
        <input type="search" name="search" id="search"><br><br>
        <label for="color">Choose color</label>
        <input type="color" name="color" id="color"><br><br>
        <!--hidden type :when you do not want the user to see-->
        <label for="range">Max price</label><br>
        <input type="range" name="range" id="range" min="0" max="1000" step="2"><br><br>
        <label for="">Gender</label><br>
        <label for="male"> Male </label>
        <input type="radio" name="gender" id="male">
        <label for="female">Female </label>
        <input type="radio" name="gender" id="female"><br><br>
        <label for="skillls">Skill </label><br><br>
        <label for="web">Web Dev</label>
        <input type="checkbox" name="skill" id="web"><br><br>
        <label for="networking">Networking</label>
        <input type="checkbox" name="skill" id="networking"><br><br>
        <label for="graphic">Graphic Design</label>
        <input type="checkbox" name="skill" id="graphic"><br><br>
        <label for="marketing">Marketing</label>
        <input type="checkbox" name="marketing" id="marketing"><br><br>
        <label for="car">Select your favorite car</label>
        <select name="car" id="car">
             <option value="ford">Ford </option>
             <option value="toyota">Toyota</option>
             <option value="bmw">BMW</option>
             <option value="alto">ALto</option>
        </select><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
