<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form</title>
</head>
<body>
    <fieldset>
        <legend>User personal information</legend>
        <label for="fullname">Enter your full name</label><br>
        <input type=" text" id="fullname" name="fullname"><br><br>
        <label for="email">Enter email</label><br>
        <input type=" email" id="email" name="email"><br><br>
        <label for="confirm">Enter password</label><br>
        <input type=" password" id="confirm" name="password"><br><br>
        <label for="pass">Confirm password </label><br>
        <input type="password" id="pass" name="password_confirm"><br><br>
        <label for="gender">Enter gender</label>
        <label for="time">Time</label>
        <input type="time" id="time" name="time">
       
</body>
</html>
