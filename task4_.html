<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Web Design</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
   <style>
      .main{
         background-color: blue;
         border-radius: 15px;
         padding:20px;
         height: 100%;
          min-height: 90vh;
          align-items: center;
      }
      .nav{
         display: flex;
         justify-content: space-between;
      }
      .left{
          display: flex
      }
      .left ul{
         list-style: none;
         display: flex;

      }
     .left a{
         color: white;
         text-decoration: none;
         margin-left: 10px;

        
      }  
      .right ul{
         color: white;
      }
      .lower{
         display: flex;
         justify-content: space-between;
         align-items: center;
      }
      .content{
         margin-right:100px;
         width:50%;
         margin-left: 30px;
         text-align: center;
         font-size: 20px;
         color:white;

      }
      button{
         background-color: blueviolet;
         padding:20px;
         border-radius: 10px;
         width: 150px;
         font-size: 15px;
         font-weight: bold;
         color: white;
         border:none;

      }
      
      .image{
         margin-right: 50px;
         border-radius: 10px;
         margin-top: 100px;
      }
   </style>
</head>
<body>
   <div class="main">
      <div class="nav">
          <div class="left">
             <ul>
              <li><i class="fa-solid fa-bars fa-xl" style="color: rgb(0, 0, 0);"></i></li>
              <li><a href="">Home</a></li>
              <li><a href="">Service</a></li>
              <li><a href="">About</a></li>
          </div>
          <div class="right">
            <ul>
               <li>Contact Us</li>
            </ul>
              
          </div>
         </div>
      <div class="lower">
         <div class="content">
             <h1>Simple Web Design</h1>
             <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Dolorem quis ipsam veniam repellat vitae fuga? Odio assumenda tempora velit a.</p>
              <button>Portfolio</button>
            </div>
         <div class="image">
            <img src="tiger-2535888_640.jpg" alt="">
         </div>
      </div>
   </div>
</body>
</html>
